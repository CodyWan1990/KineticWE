# KineticWE binary pacman repo, built on Arch and hosted on GitLab Pages.
#
# Triggers (plain branch pushes never run a pipeline - see workflow:rules):
#   * tag push ................... release build, pkgrel exactly as committed
#   * schedule "abi-watch" ....... (WATCH=1, daily) compares the published
#                                  kineticwe-abi.txt with current Arch
#                                  (ci/abi-watch.sh) and, only when Qt /
#                                  private-API KF6 versions changed or a linked
#                                  soname is gone, triggers a REBUILD=1 pipeline
#                                  on the released tag
#   * trigger REBUILD=1 .......... ABI refresh against current Arch; pkgrel gets
#                                  a .YYYYMMDDHHMM suffix so pacman offers it as
#                                  an upgrade (e.g. 15 -> 15.202608031200)
#   * schedule "daily-smoke" ..... (SMOKE=1) installs the published packages on
#                                  a fully updated Arch container and checks
#                                  every library resolves; a failure emails you
#   * manual "Run pipeline" ...... on-demand rebuild
#
# CI builds set KWE_ABI_PIN=1, so kineticwe and xdg-desktop-portal-kwe depend
# on the exact qt6-base version they were built with (Qt private API). Users'
# pacman -Syu holds a Qt update until the matching rebuild is published.
# Setup (GitLab UI): a pipeline trigger token in the masked CI/CD variable
# KWE_TRIGGER_TOKEN, a daily schedule with WATCH=1, and Settings -> CI/CD ->
# Variables -> "Minimum role to use pipeline variables" set to Maintainer
# (newer projects block pipeline variables, which would reject WATCH/REBUILD).
# Testing the trigger: run the WATCH=1 schedule with KWE_WATCH_FORCE=1 added.
# Job URLs use $CI_PAGES_URL, so a fork reads and publishes its own repo.
#
# Signing (ci/sign.sh): packages and the database are signed with the repo's
# signing subkey from KWE_SIGNING_KEY ("gpg --export-secret-subkeys <primary> |
# base64 -w0"; masked, hidden and PROTECTED, so only protected branches/tags
# sign). It must belong to the key in arch/kineticwe-keyring/. Without it the
# repo is published unsigned; set KWE_REQUIRE_SIGNING=1 once signing is live so
# that becomes an error instead.
#
# The PKGBUILD is a split package (kineticwe, xdg-desktop-portal-kwe,
# kineticwe-noctalia, kineticwe-greeter); all four are published here, plus
# kineticwe-keyring from arch/kineticwe-keyring/.
#
# Users trust the key once (pacman-key --recv-keys + --lsign-key), then add
# this to /etc/pacman.conf (pacman's default SigLevel requires signatures):
#   [kineticwe]
#   Server = https://theblackdon.gitlab.io/kineticwe/$arch

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "trigger"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - watch
  - build
  - smoke
  - deploy

variables:
  KEEP_BUILDS: "4"   # how many package versions to keep in the repo

# Shared setup: fresh keyring first (avoids the classic expired-key CI
# failure), then full system upgrade (Arch never supports partial upgrades).
.arch-sync: &arch-sync
  # fresh containers have no local secret key; without this the keyring
  # post-install hook prints a scary (but harmless) signing error
  - pacman-key --init 2>/dev/null || true
  - pacman -Sy --noconfirm archlinux-keyring
  - pacman -Su --noconfirm

abi-watch:
  stage: watch
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WATCH == "1"
  script:
    - apk add --no-cache bash curl jq libarchive-tools
    - ci/abi-watch.sh "${CI_PAGES_URL:?Pages not enabled}/x86_64/kineticwe-abi.txt"

build-package:
  stage: build
  image: archlinux:base-devel
  # a cold kwin build takes ~2h on a shared runner; the default 1h job
  # timeout kills it (first v6.7.80-16 pipeline died at exactly 60m08s)
  timeout: 3h
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REBUILD == "1"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $REBUILD == "1"
    - if: $CI_PIPELINE_SOURCE == "web"
  # Keep downloaded packages + ccache between runs (GitLab cache is limited
  # to paths inside the project dir, so point pacman's CacheDir there).
  cache:
    key: build-cache
    paths:
      - .pkg-cache/
      - .ccache/
  script:
    - *arch-sync
    - pacman -S --noconfirm --needed pacman-contrib ccache git
    # no -debug split packages: 200+ MB each, useless in a binary repo
    - echo 'OPTIONS+=( !debug )' >> /etc/makepkg.conf
    # ccache between runs: recurring (ABI-refresh) builds drop to ~20 min
    - echo 'BUILDENV+=( ccache )' >> /etc/makepkg.conf
    - export CCACHE_DIR="$CI_PROJECT_DIR/.ccache"
    - mkdir -p "$CCACHE_DIR" && chmod 777 "$CCACHE_DIR"
    - sed -i "s|^#CacheDir.*|CacheDir = $CI_PROJECT_DIR/.pkg-cache/|" /etc/pacman.conf
    # Build the spec's version and pinned commits even if the committed
    # PKGBUILD lags behind lgl-kineticwe-copr/kineticwe.spec.
    - arch/sync-from-spec.sh PKGBUILD
    # ABI refreshes between releases get a CI-only pkgrel suffix so pacman
    # offers them as upgrades; the next source release (e.g. 16) sorts higher.
    # Triggered rebuilds run on the release tag, so REBUILD=1 counts too.
    # YYYYMMDDHHMM: two rebuilds in a day stay ordered, and it sorts above the
    # older .YYYYMMDD suffixes.
    - |
      if [ -z "$CI_COMMIT_TAG" ] || [ "$REBUILD" = 1 ]; then
        echo "Rebuild reason: ${KWE_REBUILD_REASON:-manual}"
        sed -i "s/^pkgrel=.*/&.$(date +%Y%m%d%H%M)/" PKGBUILD
        grep '^pkgrel' PKGBUILD
      fi
    # Install every build dependency the PKGBUILD declares that exists in the
    # Arch repos. Runtime depends live inside the package_*() functions, so
    # only the top-level makedepends (which cover the whole build) show up
    # here; anything not in the Arch repos is reported and skipped.
    - |
      mapfile -t deps < <(bash -c 'source PKGBUILD; printf "%s\n" "${depends[@]}" "${makedepends[@]}"' | sed 's/[<>=].*$//' | sort -u)
      todo=()
      for d in "${deps[@]}"; do
        if pacman -Si "$d" &>/dev/null; then
          todo+=("$d")
        else
          echo "Skipping (not in Arch repos): $d"
        fi
      done
      pacman -S --noconfirm --needed "${todo[@]}"
    # makepkg refuses to run as root; runuser is in util-linux (base).
    - useradd -m builder
    # Build this exact CI checkout (not the PKGBUILD's pinned _commit): the
    # PKGBUILD picks up KWE_LOCAL_TARBALL, whose single top-level dir must be
    # kineticwe-$pkgver/.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - |
      pkgver=$(bash -c 'source PKGBUILD; echo "$pkgver"')
      git archive --format=tar.gz --prefix="kineticwe-$pkgver/" -o /home/builder/kineticwe-src.tar.gz HEAD
    - cp PKGBUILD kineticwe.install kineticwe-greeter.install /home/builder/ && chown -R builder:builder /home/builder
    # KWE_ABI_PIN=1: pin the exact qt6-base version (see PKGBUILD _kwe_qt_pin).
    - runuser -u builder -- env KWE_ABI_PIN=1 KWE_LOCAL_TARBALL=/home/builder/kineticwe-src.tar.gz bash -c 'cd /home/builder && makepkg -f --nodeps --noconfirm'
    # Repo keyring package (arch=any, no dependencies).
    - cp -r arch/kineticwe-keyring /home/builder/keyring && chown -R builder:builder /home/builder/keyring
    - runuser -u builder -- bash -c 'cd /home/builder/keyring && makepkg -f --nodeps --noconfirm'
    - mkdir -p public/x86_64
    # every split package (!debug above keeps -debug packages out)
    - cp /home/builder/*.pkg.tar.zst /home/builder/keyring/*.pkg.tar.zst public/x86_64/
    # Sign every package (unsigned without KWE_SIGNING_KEY, see top); repo.sh
    # then checks each signature and signs the database.
    - export GNUPGHOME="$(mktemp -d)"
    - KWE_SIGN_FPR=$(ci/sign.sh arch/kineticwe-keyring public/x86_64/*.pkg.tar.zst)
    - GPGKEY="$KWE_SIGN_FPR" ci/repo.sh public/x86_64
    # Qt / KF6 versions and linked sonames of this build, read by abi-watch.
    - ci/abi-manifest.sh /home/builder/*.pkg.tar.zst > public/x86_64/kineticwe-abi.txt
    - cat public/x86_64/kineticwe-abi.txt
  artifacts:
    paths:
      - public/

smoke-test:
  stage: smoke
  image: archlinux:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SMOKE == "1"
  cache:
    key: smoke-pkg-cache
    paths:
      - .pkg-cache/
  script:
    - *arch-sync
    - sed -i "s|^#CacheDir.*|CacheDir = $CI_PROJECT_DIR/.pkg-cache/|" /etc/pacman.conf
    # If this fails, GitLab emails the schedule owner: a library the published
    # binaries need is gone from current Arch (soname bump). ldd cannot see Qt
    # private-API breaks; the exact qt6-base pin and abi-watch cover those.
    # Rebuild via Build -> Pipelines -> Run pipeline.
    - ci/smoke.sh "${CI_PAGES_URL:?Pages not enabled}/x86_64"

pages:
  stage: deploy
  image: alpine:latest
  needs: ["build-package"]
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule" && $REBUILD == "1"
    - if: $CI_PIPELINE_SOURCE == "trigger" && $REBUILD == "1"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      cat > public/index.html <<'HTML'
      <!doctype html>
      <meta charset="utf-8">
      <title>KineticWE pacman repo</title>
      <h1>KineticWE pacman repo</h1>
      <p>Packages are signed with key <code>@FPR@</code>
      (check it against the project README). Trust it once:</p>
      <pre>sudo pacman-key --recv-keys @FPR@ --keyserver hkps://keys.openpgp.org
      sudo pacman-key --lsign-key @FPR@</pre>
      <p>If the keyserver is unreachable, download <a href="kineticwe.gpg">kineticwe.gpg</a>
      and run <code>sudo pacman-key --add kineticwe.gpg</code>, then lsign as above.</p>
      <p>Add this to <code>/etc/pacman.conf</code>:</p>
      <pre>[kineticwe]
      Server = @PAGES_URL@/$arch</pre>
      <p>Then: <code>sudo pacman -Sy kineticwe-keyring kineticwe</code> (pulls in
      <code>xdg-desktop-portal-kwe</code> and <code>kineticwe-noctalia</code>)</p>
      <p>Optional greeter: <code>sudo pacman -S kineticwe-greeter</code>, then
      run <code>kineticwe-setup-greeter</code></p>
      HTML
    # Quoted heredoc keeps pacman's literal $arch; fill in this project's URL.
    - sed -i "s|@PAGES_URL@|${CI_PAGES_URL:?Pages not enabled}|" public/index.html
    # Public key and its fingerprint, from the checkout.
    - cp arch/kineticwe-keyring/kineticwe.gpg public/kineticwe.gpg
    - sed -i "s|@FPR@|$(cut -d ':' -f1 arch/kineticwe-keyring/kineticwe-trusted | head -1)|g" public/index.html
  publish: public
