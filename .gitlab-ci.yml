# =============================================================================
# KineticWE GitLab CI — Fedora 44 and Rawhide
# =============================================================================
# Only runs on the master branch, matching the project's COPR packaging.
# =============================================================================

stages:
  - build

# ---------------------------------------------------------------------------
# Shared: install build dependencies from the spec file
# ---------------------------------------------------------------------------
.install_deps:
  before_script:
    - dnf install -y --setopt=install_weak_deps=False dnf-plugins-core
    - dnf builddep -y --spec kwin-we.spec
    - dnf install -y cmake ninja-build gcc-c++ git

# ---------------------------------------------------------------------------
# Shared: configure and build (same flags as the COPR reduced-feature build)
# ---------------------------------------------------------------------------
.build:
  script:
    - >
      cmake -B build -G Ninja
      -DCMAKE_BUILD_TYPE=Release
      -DKWIN_BUILD_KCMS=OFF
      -DKWIN_BUILD_SCREENLOCKER=OFF
      -DKWIN_BUILD_TABBOX=OFF
      -DKWIN_BUILD_ACTIVITIES=OFF
      -DKWIN_BUILD_RUNNERS=OFF
      -DKWIN_BUILD_NOTIFICATIONS=OFF
      -DKWIN_BUILD_GLOBALSHORTCUTS=OFF
      -DKWIN_BUILD_X11=OFF
      -DKWIN_BUILD_EIS=OFF
      -DKWIN_BUILD_QACCESSIBILITYCLIENT=OFF
    - cmake --build build --parallel $(nproc)

# ---------------------------------------------------------------------------
# Fedora 44 — mirrors the primary COPR target
# ---------------------------------------------------------------------------
fedora44:
  extends:
    - .install_deps
    - .build
  stage: build
  image: fedora:44
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

# ---------------------------------------------------------------------------
# Fedora Rawhide — bleeding-edge compatibility check
# ---------------------------------------------------------------------------
rawhide:
  extends:
    - .install_deps
    - .build
  stage: build
  image: fedora:rawhide
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

